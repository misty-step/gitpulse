# Lefthook Configuration
# Fast git hooks (3-5x faster than Husky, parallel execution)
# Performance budget: <5s pre-commit, <15s pre-push

pre-commit:
  parallel: true
  commands:
    llm-sanity:
      glob: "{packages/agent-core/src/**,packages/schemas/src/**,apps/cli/src/**,apps/web/app/api/agent/**,scripts/audit-llm-models.sh,.github/workflows/evals.yml}"
      run: bun run test:llm
    secrets:
      run: gitleaks protect --staged --verbose --config .gitleaks.toml

pre-push:
  # Sequential prevents excessive parallel load from typecheck+test+build.
  parallel: false
  commands:
    typecheck:
      run: bun run typecheck
    test:
      run: bun run test
    build:
      run: |
        if [ "${SKIP_BUILD_CHECK:-}" = "true" ]; then
          echo "⚠️  Skipping build check (SKIP_BUILD_CHECK=true)"
          exit 0
        fi
        echo "🔨 Running build check..."
        bun run build
