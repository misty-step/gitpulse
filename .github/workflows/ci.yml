name: CI

on:
  pull_request:

jobs:
  trufflehog:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bun 1.3.x ships `bun audit`, but it does not expose a severity threshold
      # flag yet. Treat this as a coarse dependency audit until Bun adds one.
      - name: Run security audit
        run: bun audit
        continue-on-error: false

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: [typecheck, test, build]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.check }}
        run: bun run ${{ matrix.check }}

  merge-gate:
    name: merge-gate
    needs: [trufflehog, security-audit, quality-gates]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.trufflehog.result }}" == "success" && \
                "${{ needs.security-audit.result }}" == "success" && \
                "${{ needs.quality-gates.result }}" == "success" ]]; then
            echo "merge-gate green"
          else
            echo "merge-gate red (trufflehog=${{ needs.trufflehog.result }}, security-audit=${{ needs.security-audit.result }}, quality-gates=${{ needs.quality-gates.result }})"
            exit 1
          fi
