name: LLM Infrastructure Gates

on:
  pull_request:
    paths:
      - "packages/agent-core/src/**"
      - "packages/schemas/src/**"
      - "apps/cli/src/**"
      - "apps/web/app/api/agent/**"
      - "scripts/audit-llm-models.sh"
      - ".github/workflows/evals.yml"
  workflow_dispatch:

concurrency:
  group: llm-infra-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  llm-infra:
    name: LLM Model/Prompt Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: LLM-focused tests
        run: bun run test:llm

      - name: LLM model audit
        run: bun run audit:llm
